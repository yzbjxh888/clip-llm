[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipllm02"
version = "0.2.27"
description = "clip-llm 0.2 可插拔内容解释与路由引擎：核心骨架（纯标准库）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8"]

[project.scripts]
clipllm02 = "clipllm02.cli:main"
clipllm02-desktop = "clipllm02.studio.__main__:main"
clipllm02-studio = "clipllm02.studio.__main__:main"
clipllm02-classic = "clipllm02.desktop.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipllm02*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
